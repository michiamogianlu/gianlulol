<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gianlu</title>
</head>
<body>
  <h1>Accesso</h1>

  <form id="form">
    <label for="password">Password:</label>
    <input type="password" id="password" autofocus>
    <button type="submit">Entra</button>
  </form>

  <p id="messaggio"></p>

  <script>
    try {
      if (sessionStorage.getItem("errore")) {
        document.getElementById("messaggio").textContent = "Ah qua entriamo senza autorizzazione eh me la segno...";
        sessionStorage.removeItem("errore");
      }
    } catch (e) {}

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      try {
        sessionStorage.setItem("k", document.getElementById("password").value);
      } catch (err) {
        document.getElementById("messaggio").textContent = "Il tuo browser non va bene cambialo your problem not mine";
        return;
      }
      window.location.href = "lista.html";
    });
  </script>
</body>
</html>
