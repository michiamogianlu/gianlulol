<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gianlu</title>
</head>
<body>
  <h1>Accesso</h1>

  <form id="form">
    <label for="password">Password:</label>
    <input type="password" id="password" autofocus>
    <button type="submit">Entra</button>
  </form>

  <p id="messaggio"></p>

  <script>
    // Qui non c'è nessun controllo: la password giusta è quella che riesce
    // a decifrare /lista/. Se è sbagliata, /lista/ rimanda qui.
    try {
      if (sessionStorage.getItem("errore")) {
        document.getElementById("messaggio").textContent = "Password errata, riprova.";
        sessionStorage.removeItem("errore");
      }
    } catch (e) {}

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      try {
        sessionStorage.setItem("k", document.getElementById("password").value);
      } catch (err) {
        document.getElementById("messaggio").textContent = "Il browser blocca la memoria di sessione.";
        return;
      }
      window.location.href = "lista/";
    });
  </script>
</body>
</html>
